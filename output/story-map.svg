  </defs>
  <rect x="0" y="0" width="1464" height="916" fill="#ffffff"/>
  <text x="32" y="48" font-size="22" font-weight="600" fill="#111827">Thymus 交付故事地图 · 现在能做到什么</text>
  <text x="32" y="72" font-size="13" fill="#6b7280">一次交付的六个环节，以及每个环节里系统做什么、人做什么、什么现在不做</text>
  <rect x="196" y="96" width="196" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="294" y="128" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">① 读 SOP</text>
  <rect x="404" y="96" width="196" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="502" y="128" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">② 写声明</text>
  <rect x="612" y="96" width="196" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="710" y="128" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">③ 冻结前检查</text>
  <rect x="820" y="96" width="196" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="918" y="128" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">④ 挂上运行时</text>
  <rect x="1028" y="96" width="196" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1126" y="128" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">⑤ 上线运行</text>
  <rect x="1236" y="96" width="196" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1334" y="128" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">⑥ 每天回流</text>
  <text x="32" y="167" font-size="12" fill="#9ca3af">交付顺序</text>
  <line x1="196" y1="162" x2="1432" y2="162" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <circle cx="40" cy="198" r="5" fill="#9ca3af"/>
  <text x="54" y="203" font-size="14" font-weight="600" fill="#374151">交付动作</text>
  <rect x="204" y="190" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="214" y="212" font-size="12" fill="#111827">逐条读，打五种标记</text>
  <rect x="204" y="234" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="214" y="256" font-size="12" fill="#111827">套不上的单独记一处</text>
  <rect x="412" y="190" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="422" y="212" font-size="12" fill="#111827">填字段</text>
  <rect x="412" y="234" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="422" y="256" font-size="12" fill="#111827">写三组考题</text>
  <rect x="412" y="278" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="422" y="300" font-size="12" fill="#111827">登记 uncovered</text>
  <rect x="620" y="190" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="630" y="212" font-size="12" fill="#111827">跑机械闸（不花钱）</text>
  <rect x="620" y="234" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="630" y="256" font-size="12" fill="#111827">跑考题（语义类调模型）</text>
  <rect x="828" y="190" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="838" y="212" font-size="12" fill="#111827">先注册受管工具</text>
  <rect x="828" y="234" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="838" y="256" font-size="12" fill="#111827">再装约束</text>
  <rect x="828" y="278" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="838" y="300" font-size="12" fill="#111827">最后放 agent 进来</text>
  <rect x="1036" y="190" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="1046" y="212" font-size="12" fill="#111827">agent 接客</text>
  <rect x="1036" y="234" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="1046" y="256" font-size="12" fill="#111827">越界自动转出</text>
  <rect x="1244" y="190" width="180" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="1254" y="212" font-size="12" fill="#111827">捞 → 标 → 分流 → 并入 → </text>
  <text x="1254" y="228" font-size="12" fill="#111827">回归</text>
  <rect x="180" y="340" width="1252" height="268" rx="10" fill="#f6fdf9"/>
  <circle cx="40" cy="360" r="5" fill="#16a34a"/>
  <text x="54" y="365" font-size="14" font-weight="600" fill="#374151">系统给你的</text>
