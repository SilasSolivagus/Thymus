  <text x="214" y="376" font-size="12" fill="#14532d">五种内置类型的判据</text>
  <rect x="204" y="400" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="214" y="424" font-size="12" fill="#14532d">填表工作单 TEMPLATE</text>
  <rect x="412" y="352" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="422" y="376" font-size="12" fill="#14532d">A1 字面禁语</text>
  <rect x="412" y="400" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
