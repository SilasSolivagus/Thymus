  <rect x="412" y="448" width="180" height="52" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="422" y="470" font-size="12" fill="#14532d">B 认人前置 / B2 认人后才</text>
  <text x="422" y="486" font-size="12" fill="#14532d">能说</text>
  <rect x="412" y="508" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="422" y="532" font-size="12" fill="#14532d">C 内部字段抹除</text>
  <rect x="412" y="556" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="422" y="580" font-size="12" fill="#14532d">D 越界兜底</text>
  <rect x="620" y="352" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="630" y="376" font-size="12" fill="#14532d">checkSpecHygiene 四查</text>
  <rect x="620" y="400" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="630" y="424" font-size="12" fill="#14532d">留出伪装逐类型检出</text>
  <rect x="620" y="448" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="630" y="472" font-size="12" fill="#14532d">checkSpecEvals 三组数字</text>
  <rect x="620" y="496" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="630" y="520" font-size="12" fill="#14532d">不过就拒绝冻结</text>
  <rect x="828" y="352" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="838" y="376" font-size="12" fill="#14532d">installToolGate 挂调度器</text>
  <rect x="828" y="400" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="838" y="424" font-size="12" fill="#14532d">installSayGate 缓冲全流</text>
  <rect x="828" y="448" width="180" height="52" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="838" y="470" font-size="12" fill="#14532d">installProposeTool 配额</text>
  <text x="838" y="486" font-size="12" fill="#14532d">去重回收</text>
  <rect x="828" y="508" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="838" y="532" font-size="12" fill="#14532d">判决聚合：任一拒即拒</text>
  <rect x="1036" y="352" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="1046" y="376" font-size="12" fill="#14532d">工具：拒绝 / 产出抹除</text>
  <rect x="1036" y="400" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="1046" y="424" font-size="12" fill="#14532d">说话：改写但不停轮</text>
  <rect x="1036" y="448" width="180" height="52" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="1046" y="470" font-size="12" fill="#14532d">agent 提工具，宿主批了才</text>
  <text x="1046" y="486" font-size="12" fill="#14532d">装</text>
  <rect x="1036" y="508" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="1046" y="532" font-size="12" fill="#14532d">新工具默认受管</text>
  <rect x="1244" y="352" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="1254" y="376" font-size="12" fill="#14532d">splitBadCases 确定性分流</text>
  <rect x="1244" y="400" width="180" height="52" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="1254" y="422" font-size="12" fill="#14532d">redactHeldout 留出只给数</text>
  <text x="1254" y="438" font-size="12" fill="#14532d">字</text>
  <rect x="1244" y="460" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="1254" y="484" font-size="12" fill="#14532d">compareReports 回归比对</text>
  <rect x="180" y="622" width="1252" height="120" rx="10" fill="#fffcf6"/>
  <circle cx="40" cy="642" r="5" fill="#ea580c"/>
  <text x="54" y="647" font-size="14" font-weight="600" fill="#374151">只能人做</text>
  <rect x="204" y="634" width="180" height="52" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="214" y="656" font-size="12" fill="#7c2d12">判定「这条表达不了」——模</text>
  <text x="214" y="672" font-size="12" fill="#7c2d12">型从不主动说</text>
  <rect x="412" y="634" width="180" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="422" y="660" font-size="12" fill="#7c2d12">写留出题</text>
  <rect x="412" y="686" width="180" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="422" y="712" font-size="12" fill="#7c2d12">把混写的条款拆开</text>
  <rect x="620" y="634" width="180" height="52" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="630" y="656" font-size="12" fill="#7c2d12">看数字调措辞——唯一没有机</text>
  <text x="630" y="672" font-size="12" fill="#7c2d12">械检查的一环</text>
  <rect x="828" y="634" width="180" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="838" y="660" font-size="12" fill="#7c2d12">定免检名单（白名单）</text>
  <rect x="1036" y="634" width="180" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="1046" y="660" font-size="12" fill="#7c2d12">抽检</text>
  <rect x="1244" y="634" width="180" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="1254" y="660" font-size="12" fill="#7c2d12">判「这句该不该拦」</text>
  <rect x="180" y="756" width="1252" height="76" rx="10" fill="#fafafa"/>
  <circle cx="40" cy="776" r="5" fill="#9ca3af"/>
  <text x="54" y="781" font-size="14" font-weight="600" fill="#374151">现在不碰</text>
  <rect x="412" y="768" width="180" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="422" y="794" font-size="12" fill="#6b7280">客户自己填不填得对，没测</text>
  <rect x="828" y="768" width="180" height="52" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="838" y="790" font-size="12" fill="#6b7280">沙箱不是安全边界（dsh 明</text>
  <text x="838" y="806" font-size="12" fill="#6b7280">说）</text>
  <rect x="1036" y="768" width="180" height="52" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="1046" y="790" font-size="12" fill="#6b7280">数据脏 / 权限边界 / 系统</text>
  <text x="1046" y="806" font-size="12" fill="#6b7280">集成</text>
  <rect x="1244" y="768" width="180" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="1254" y="794" font-size="12" fill="#6b7280">只支持说话类样本</text>
  <rect x="32" y="854" width="1400" height="34" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="48" y="865" width="14" height="12" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="70" y="876" font-size="12" fill="#374151">已实测可用</text>
  <rect x="178" y="865" width="14" height="12" rx="3" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="200" y="876" font-size="12" fill="#374151">人不可替代</text>
  <rect x="308" y="865" width="14" height="12" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="330" y="876" font-size="12" fill="#374151">不做或没验</text>
  <text x="458" y="876" font-size="12" fill="#9ca3af">绿色那一行每一项都有实测支撑；橙色那一行是这轮实验反复证明省不掉的</text>
</svg>